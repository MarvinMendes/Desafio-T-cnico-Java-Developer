services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: activation
      POSTGRES_USER: activation
      POSTGRES_PASSWORD: activation
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U activation -d activation"]
      interval: 5s
      timeout: 5s
      retries: 10

  provider-mock:
    image: wiremock/wiremock:3.12.1
    ports:
      - "8081:8080"
    volumes:
      - ./docker/wiremock:/home/wiremock
    command: ["--global-response-templating"]

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/activation
      SPRING_DATASOURCE_USERNAME: activation
      SPRING_DATASOURCE_PASSWORD: activation
      PROVIDER_BASE_URL: http://provider-mock:8080
      JAVA_TOOL_OPTIONS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"
      MANAGEMENT_OTLP_TRACING_EXPORT_ENABLED: "false"
    ports:
      - "8080:8080"
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s

volumes:
  postgres_data:
