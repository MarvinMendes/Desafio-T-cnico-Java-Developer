spring:
  datasource:
    url: jdbc:h2:mem:activation_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    show-sql: false

provider:
  stub: true
  max-attempts: 3

activation:
  processing:
    async: false

app:
  security:
    rate-limit-per-minute: 1000
    max-body-bytes: 16384
