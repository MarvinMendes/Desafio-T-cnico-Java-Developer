spring:
  application:
    name: activation-service
  profiles:
    default: dev
  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  lifecycle:
    timeout-per-shutdown-phase: 30s
  security:
    oauth2:
      resourceserver:
        jwt:
          public-key-location: classpath:keys/app.pub

server:
  port: 8080
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never

app:
  security:
    rate-limit-per-minute: 60
    max-body-bytes: 16384

provider:
  base-url: http://localhost:8081
  connect-timeout: 2s
  read-timeout: 5s
  max-attempts: 3
  stub: false

activation:
  processing:
    async: true

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} [%X{traceId:-}] %-5level [%thread] %logger{36} : %msg%n"
  level:
    org.springframework.security: INFO
    org.springframework.web.client: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      export:
        enabled: false
  metrics:
    tags:
      application: ${spring.application.name}
